<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - To-Do List</title>

    <link rel="icon" type="image/png" href="pig.png">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-pink-header mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-check2-square"></i> Task Manager</span>
        </div>
    </nav>

    <div class="container main-container">
        <div class="row mb-3 g-2">
            <div class="col-md-6 d-flex gap-2">
                <select id="filterSelect" class="form-select w-auto">
                    <option value="all">Все задачи</option>
                    <option value="done">Выполненные</option>
                    <option value="pending">Не выполненные</option>
                    <option value="in-progress">В процессе</option>
                </select>
                <select id="sortSelect" class="form-select w-auto">
                    <option value="date-new">Сначала новые</option>
                    <option value="date-old">Сначала старые</option>
                    <option value="alphabet">По алфавиту (А-Я)</option>
                </select>
            </div>
            <div class="col-md-6 text-end">
                <button class="btn btn-pink" onclick="openAddModal()">
                    <i class="bi bi-plus-lg"></i> Добавить задачу
                </button>
            </div>
        </div>

        <div id="taskList" class="row g-3">
        </div>

        <div id="emptyState" class="text-center text-muted mt-5 d-none">
            <h4>Задач пока нет</h4>
            <p>Нажмите "Добавить задачу", чтобы начать.</p>
        </div>
    </div>

    <div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">Новая задача</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="taskForm">
                        <input type="hidden" id="taskId">
                        
                        <div class="mb-3">
                            <label for="taskTitle" class="form-label">Название</label>
                            <input type="text" class="form-control" id="taskTitle" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="taskDesc" class="form-label">Описание</label>
                            <textarea class="form-control" id="taskDesc" rows="3"></textarea>
                        </div>
                        
                        <div class="mb-3">
                            <label for="taskDate" class="form-label">Срок выполнения</label>
                            <input type="date" class="form-control" id="taskDate" required>
                        </div>
                        
                        <div class="mb-3" id="statusGroup" style="display: none;">
                            <label for="taskStatus" class="form-label">Статус</label>
                            <select class="form-select" id="taskStatus">
                                <option value="pending">Не выполнена</option>
                                <option value="in-progress">В процессе</option>
                                <option value="done">Выполнена</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-pink-save" onclick="saveTask()">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="script.js"></script>
</body>
</html>
